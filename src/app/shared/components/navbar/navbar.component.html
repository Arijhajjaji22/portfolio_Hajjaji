<!-- Top Scroll Progress Bar (gradient) -->
<div
  class="navbar-scroll-progress"
  [style.width.%]="scrollProgress()"
  aria-hidden="true">
</div>

<header class="navbar-wrapper">
  <div class="navbar-inner">

    <!-- Logo "AH" gradient text -->
    <a routerLink="/" fragment="hero" class="logo-link" aria-label="Arij Hajjaji Home">
      <span class="logo-text">AH</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-links" aria-label="Main Navigation">
      @for (link of navLinks; track link.section) {
        <a
          routerLink="/"
          [fragment]="link.section"
          class="nav-link"
          [class.active]="activeSection() === link.section">
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>

    <!-- Controls: Theme Toggle + Resume + Mobile Hamburger -->
    <div class="nav-controls">
      <!-- Theme Toggle -->
      <button
        type="button"
        class="theme-toggle-btn"
        (click)="themeService.toggleTheme($event)"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        title="Toggle color theme">
        @if (themeService.isDark()) {
          <!-- Sun Icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <!-- Moon Icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        }
      </button>

      <!-- Resume Button -->
      <a href="/assets/resume.pdf" target="_blank" rel="noopener" class="resume-btn">
        Resume
      </a>

      <!-- Mobile Menu Button -->
      <button
        type="button"
        class="mobile-menu-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle navigation menu">
        @if (isMobileMenuOpen()) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="4" y1="8" x2="20" y2="8"></line>
            <line x1="4" y1="16" x2="20" y2="16"></line>
          </svg>
        }
      </button>
    </div>

  </div>

  <!-- Mobile Dropdown -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-dropdown">
      <nav class="mobile-nav">
        @for (link of navLinks; track link.section) {
          <a
            routerLink="/"
            [fragment]="link.section"
            class="mobile-link"
            [class.active]="activeSection() === link.section"
            (click)="closeMobileMenu()">
            {{ link.label }}
          </a>
        }
        <a href="/assets/resume.pdf" target="_blank" rel="noopener" class="mobile-resume-btn" (click)="closeMobileMenu()">
          Resume
        </a>
      </nav>
    </div>
  }
</header>
